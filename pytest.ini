[pytest]
# 会话级 basetemp 固定到仓库内（`.gitignore` 已忽略 `.pytest-tmp/`）。
#
# 为什么必须显式指定：默认情况下 pytest 在系统 Temp 下使用 `pytest-of-<user>/pytest-<N>`
# 编号目录 + `pytest-current` 目录符号链接，会话收尾时 `cleanup_dead_symlinks()` 会对失效链接
# 调用 `Path.unlink()`；Windows 上 `unlink()`（DeleteFileW）对**目录**符号链接返回
# `WinError 5 拒绝访问`，于是整个 pytest 进程以退出码 1 结束 —— 即便全部用例都通过。
# 实测证据与根因见 `docs/PROJECT-STATE.md` 变更记录。
#
# 指定 basetemp 后 pytest 走 `given_basetemp` 分支：每次会话开始时整体重建该目录，
# 不创建 `pytest-current` 符号链接，也就不再触碰系统 Temp 的同名残留。
# 注意：相对路径按**调用时的工作目录**解析，故请在仓库根目录执行 `python -m pytest ...`。
addopts = --basetemp=.pytest-tmp
