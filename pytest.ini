[pytest]
# 会话级 basetemp：**由仓库根 `conftest.py` 的 `pytest_configure` 设为本次会话独有的子目录**
# （`.pytest-tmp/session-<pid>-<8位随机>`）。这里**不再**写死 `--basetemp=.pytest-tmp`。
#
# 为什么必须显式指定 basetemp（**这条理由没变**）：默认情况下 pytest 在系统 Temp 下使用
# `pytest-of-<user>/pytest-<N>` 编号目录 + `pytest-current` 目录符号链接，会话收尾时
# `cleanup_dead_symlinks()` 会对失效链接调用 `Path.unlink()`；Windows 上 `unlink()`（DeleteFileW）
# 对**目录**符号链接返回 `WinError 5 拒绝访问`，于是整个 pytest 进程以退出码 1 结束 ——
# 即便全部用例都通过。实测证据与根因见 `docs/PROJECT-STATE.md` 变更记录。
#
# 指定 basetemp 后 pytest 走 `given_basetemp` 分支：**不创建 `pytest-current`**，
# 也就不再触碰系统 Temp 的同名残留。
#
# 为什么**不能**写死成 `.pytest-tmp`（`2026-10-02` 父代理裁定）：pytest 在会话开始时
# **整体重建** basetemp，而多会话/并行 Agent 同时跑时，刚退出的进程的文件句柄可能还没释放，
# 重建就撞 `PermissionError: [WinError 32] 另一个程序正在使用此文件` —— 表现为 `ERROR at setup`，
# **看起来像"偶发红"**，会摧毁整套测试的可信度。改成每会话独立子目录后，重建只动自己的空目录。
# 背景、实测证据与"不再产生 pytest-current"的确认见仓库根 `conftest.py`。
#
# 注意：本项目**不使用** `addopts`（无隐性开关）；路径按调用时的工作目录解析，
# 故请在仓库根目录执行 `python -m pytest ...`。
